    <path id="p30" d="M180 130 L180 300" stroke-width="5"/>
    <!-- 플로트 41 -->
    <rect id="p41" x="225" y="268" width="36" height="22" rx="4"/>
    <!-- 지시봉 42 -->
    <path id="p42" d="M243 268 L243 40" stroke-width="3"/>
    <!-- 수위 표시부 40 (점선 범위) -->
    <rect id="p40" x="218" y="30" width="52" height="268" stroke-dasharray="3 3" stroke-width="1"/>
    <!-- 급수 조절 밸브 50 -->
    <path id="p50" d="M290 250 L320 250 M305 238 L305 262" stroke-width="3"/>
    <circle cx="305" cy="250" r="8"/>
  </g>
  <g fill="#111">
    <text x="20" y="150">10</text><path d="M40 146 L92 146" stroke="#111"/>
    <text x="196" y="250">11</text>
    <text x="20" y="320">20</text><path d="M40 316 L72 316" stroke="#111"/>
    <text x="120" y="170">30</text><path d="M138 166 L178 170" stroke="#111"/>
    <text x="300" y="30">40</text><path d="M298 26 L270 40" stroke="#111"/>
    <text x="300" y="300">41</text><path d="M298 296 L262 284" stroke="#111"/>
    <text x="200" y="40">42</text><path d="M218 36 L240 50" stroke="#111"/>
    <text x="322" y="230">50</text><path d="M326 234 L310 244" stroke="#111"/>
    <text x="110" y="385" font-size="12" fill="#555">도 1 — 가상 공보 단면도 (실제 특허 아님)</text>
