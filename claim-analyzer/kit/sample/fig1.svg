<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" font-family="Arial, sans-serif" font-size="13">
  <title>도 1 (가상 공보의 단면도)</title>
  <rect width="360" height="400" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="2">
    <!-- 화분 본체 10 -->
    <path id="p10" d="M80 60 L280 60 L260 220 L100 220 Z"/>
    <!-- 흙 -->
    <path d="M86 90 L274 90" stroke-dasharray="4 4" stroke-width="1"/>
