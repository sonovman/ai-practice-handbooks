    <rect id="p11" x="170" y="214" width="20" height="12" fill="#fff"/>
    <!-- 물탱크 20 -->
    <path id="p20" d="M70 226 L290 226 L290 340 L70 340 Z"/>
    <path d="M72 280 L288 280" stroke-width="1"/>
